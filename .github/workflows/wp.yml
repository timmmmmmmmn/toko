name: Windows 10 Mobile-app

# Bouwt de appx'en voor Windows 10 Mobile (Lumia): Toko zelf (wp/appx) en de games zonder eigen Lumia-build in hun
# repo (wp/spellen/<id>: hosted web apps die /wp van de game openen). Allemaal in de release 'wp-latest'.
# Ondertekend met het eigen certificaat (wp/TimVanBergen.cer op de telefoon installeren).
on:
  push:
    branches: [main]
    paths: ['wp/appx/**', 'wp/spellen/**', '.github/workflows/wp.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Appx maken en ondertekenen
        shell: pwsh
        env:
          WP_PFX_BASE64: ${{ secrets.WP_PFX_BASE64 }}
          WP_PFX_PASSWORD: ${{ secrets.WP_PFX_PASSWORD }}
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64" | Where-Object { Test-Path "$($_.FullName)\makeappx.exe" } | Sort-Object { [version]$_.Parent.Name } -Descending | Select-Object -First 1
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WP_PFX_BASE64))
          $pakketten = @{ 'Toko' = 'wp\appx'; 'Galgje' = 'wp\spellen\galgje'; 'AgoraBosgevecht' = 'wp\spellen\agora'; 'ShaneDeadRedemption' = 'wp\spellen\shane'; 'SkittaLite' = 'wp\spellen\skittalite'; 'Scorroday' = 'wp\spellen\scorroday'; 'NaviKarta' = 'wp\spellen\navikarta'; 'Boodschappenlijst' = 'wp\spellen\boodschappen'; 'Muzu' = 'wp\spellen\muzu'; 'JensRunLite' = 'wp\spellen\jensrunlite'; 'AngryMo' = 'wp\spellen\angrymo'; 'Wierie' = 'wp\spellen\wierie' }
          foreach ($p in $pakketten.GetEnumerator()) {
            & "$($sdk.FullName)\makeappx.exe" pack /o /d $p.Value /p "$($p.Key).appx"
            if ($LASTEXITCODE) { exit 1 }
            & "$($sdk.FullName)\signtool.exe" sign /fd SHA256 /f $pfx /p $env:WP_PFX_PASSWORD "$($p.Key).appx"
            if ($LASTEXITCODE) { exit 1 }
          }
          Remove-Item $pfx

      - name: Proefinstallatie (manifest en handtekening kloppen)
        shell: pwsh
        run: |
          Import-Certificate -FilePath wp\TimVanBergen.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Get-ChildItem *.appx | ForEach-Object { Add-AppxPackage -Path $_.FullName }
          Get-AppxPackage -Name 'TimvanBergen.*' | Format-List Name, Version, Publisher

      - name: Release publiceren
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wp-latest --yes --cleanup-tag 2>$null
          gh release create wp-latest Toko.appx Galgje.appx AgoraBosgevecht.appx ShaneDeadRedemption.appx SkittaLite.appx Scorroday.appx NaviKarta.appx Boodschappenlijst.appx Muzu.appx JensRunLite.appx AngryMo.appx Wierie.appx wp\TimVanBergen.cer --title "Windows 10 Mobile-app" --notes "Voor Windows 10 Mobile (bijv. Lumia 435). Installeren: zet Ontwikkelaarsmodus aan, open TimVanBergen.cer en daarna Toko.appx." --latest=false
          # GitHub maakt er soms een concept zonder tag van als de oude tag net weg is: dan geven alle downloads 404
          gh release edit wp-latest --draft=false --tag wp-latest

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F9FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1520" media="(prefers-color-scheme: dark)">
<title>Toko</title>
<meta name="description" content="Toko – de winkel voor alle apps van Tim van Bergen.">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" href="/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="mast">
    <h1 class="mast-title" id="title">Toko</h1>
    <div class="row">
      <span class="sync-dot busy" id="sync" title="Laden"></span>
      <button class="icon-btn" id="refresh" type="button" aria-label="Vernieuwen"><span data-icon="refresh"></span></button>
    </div>
  </header>

  <div class="search-wrap" id="searchWrap">
    <span data-icon="search"></span>
    <input class="search" id="search" type="search" placeholder="Zoeken in Toko" autocomplete="off" aria-label="Zoeken">
  </div>
  <div class="chips" id="chips"></div>

  <main class="list" id="list"></main>

  <nav class="nav" id="nav" aria-label="Navigatie">
    <div class="nav-pill" id="navPill">
      <span class="nav-ind" id="navInd" aria-hidden="true"></span>
      <button type="button" data-nav="ontdek" aria-current="true"><span data-icon="compass"></span>Ontdek</button>
      <button type="button" data-nav="apps"><span data-icon="grid"></span>Mijn apps</button>
      <button type="button" data-nav="updates"><span data-icon="download"></span>Updates<b class="badge" id="badge" hidden></b></button>
      <button type="button" data-nav="meer"><span data-icon="more"></span>Meer</button>
    </div>
    <button type="button" class="nav-add" id="navAdd" aria-label="Zoeken"><span data-icon="search"></span></button>
  </nav>
</div>

<div class="sheet-back" id="sheetBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-top">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="Sluiten"><span data-icon="close"></span></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
